
name: 
name: Build NUM-X APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NUM-X project
        run: |
          unzip -q NUM-X-Android-Project.zip -d numx-project
          cd numx-project
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: numx-project
        run: gradle assembleDebug

      - name: Upload NUM-X APK
        uses: actions/upload-artifact@v4
        with:
          name: NUM-X-APK
          path: numx-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
